# Keep this action name stable so Marketplace releases continue to publish
# to https://github.com/marketplace/actions/cythinst-64.
name: 'Cythinst 64'
description: 'Build Windows PyInstaller executables with Wine, uv, Cython, and Windows Python 3.13'
author: 'PlohnenSoftware'
branding:
  icon: 'box'
  color: 'green'
inputs:
  path:
    description: 'Project directory containing the PyInstaller spec file.'
    required: true
    default: src
  pypi_url:
    description: 'Custom PyPI base URL used for pip compatibility when writing pip.ini.'
    required: false
    default: https://pypi.python.org/
  pypi_index_url:
    description: 'Custom Python package index URL used by uv and pip.'
    required: false
    default: https://pypi.python.org/simple
  spec:
    description: 'PyInstaller spec file to build. Relative to the selected path.'
    required: false
    default: "*.spec"
  requirements:
    description: 'Requirements file, relative to path. When present, it is installed before pyproject.toml dependencies are considered.'
    required: false
    default: "requirements.txt"
  cython_out:
    description: 'Optional output directory for compiled .pyd files, relative to the selected path.'
    required: false
    default: ""
  zip_name:
    description: 'Optional .zip file to create after a successful build, relative to the repository root. Leave empty to skip zip creation.'
    required: false
    default: ""
  zip_paths:
    description: 'Newline-separated repository-root-relative files, directories, or glob patterns. Each selected path is placed at the archive root.'
    required: false
    default: ""
  zip_method:
    description: 'ZIP compression method: bzip2, lzma, deflate, or store.'
    required: false
    default: "bzip2"
  zip_level:
    description: 'ZIP compression level from 0 to 9. Used by deflate and bzip2; accepted for all methods for a stable interface.'
    required: false
    default: "9"
outputs:
  output:
    description: 'zip_name when a zip is created, otherwise <path>/dist/windows.'

runs:
  using: 'docker'
  image: 'Dockerfile'
  args:
    - ${{ inputs.path }}
    - ${{ inputs.pypi_url }}
    - ${{ inputs.pypi_index_url }}
    - ${{ inputs.spec }}
    - ${{ inputs.requirements }}
    - ${{ inputs.cython_out }}
    - ${{ inputs.zip_name }}
    - ${{ inputs.zip_paths }}
    - ${{ inputs.zip_method }}
    - ${{ inputs.zip_level }}
