# Keep this action name stable so Marketplace releases continue to publish
# to https://github.com/marketplace/actions/cythinst-64.
name: 'Cythinst 64'
description: 'Build Windows PyInstaller executables with Wine, uv, Cython, and Windows Python 3.14'
author: 'PlohnenSoftware'
branding:
  icon: 'box'
  color: 'green'
inputs:
  path:
    description: 'Project directory containing the PyInstaller spec file and either pyproject.toml/uv.lock or requirements.txt.'
    required: true
    default: src
  pypi_url:
    description: 'Custom PyPI base URL used for pip compatibility when writing pip.ini.'
    required: false
    default: https://pypi.python.org/
  pypi_index_url:
    description: 'Custom Python package index URL used by uv and pip.'
    required: false
    default: https://pypi.python.org/simple
  spec:
    description: 'PyInstaller spec file to build. Relative to the selected path.'
    required: false
    default: "*.spec"
  requirements:
    description: 'Requirements file used only when pyproject.toml is not present.'
    required: false
    default: "requirements.txt"
  cython_out:
    description: 'Optional output directory for compiled .pyd files, relative to the selected path.'
    required: false
    default: ""
outputs:
  output:
    description: 'Reserved for future build metadata. Built files are written to <path>/dist/windows.'

runs:
  using: 'docker'
  image: 'Dockerfile'
  args:
    - ${{ inputs.path }}
    - ${{ inputs.pypi_url }}
    - ${{ inputs.pypi_index_url }}
    - ${{ inputs.spec }}
    - ${{ inputs.requirements }}
    - ${{ inputs.cython_out }}
